<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>For You ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Use dvh (dynamic viewport height) for mobile browsers */
            height: 100dvh; 
            width: 100vw;
            background-color: #fff0f3;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2);
            /* Ensure it takes up good space on mobile */
            width: 85%;
            max-width: 350px;
            z-index: 10;
        }

        .gif-container {
            width: 100%;
            margin-bottom: 1rem;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            border-radius: 15px;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            position: relative;
            /* Prevents the growing button from pushing the UI off screen immediately */
            height: 100px; 
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            position: relative;
            z-index: 5;
        }

        #noBtn {
            background-color: #808080;
            color: white;
            position: relative;
            z-index: 4;
        }

        .hidden { display: none; }

        .heart {
            position: fixed;
            top: -10vh;
            font-size: 2rem;
            animation: fall 3s linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="question-box">
            <div class="gif-container">
                <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGtxN2ZicWlzYmI1ZzF4M3Z6ZzV6Z3Z5eXp6Z3Z5eXp6Z3Z5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Asking">
            </div>
            <h1 id="main-text">Will you be my Valentine? 💖</h1>
            <div class="btn-group">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="success-box" class="hidden">
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGtxN2ZicWlzYmI1ZzF4M3Z6ZzV6Z3Z5eXp6Z3Z5eXp6Z3Z5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26FLdmIp6wJr91JAI/giphy.gif" alt="Happy">
            </div>
            <h1 style="color: #ff4d6d;">Yay! See you on the 14th! 🥰</h1>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionBox = document.getElementById('question-box');
        const successBox = document.getElementById('success-box');

        let scale = 1;
        const phrases = ["No", "Sure?", "Really?", "Puh-lease?", "I'm crying", "Yes is better"];
        let phraseIndex = 0;

        noBtn.addEventListener('click', (e) => {
            scale += 0.4;
            // Prevent it from growing infinitely and breaking the phone's browser
            if(scale < 12) {
                yesBtn.style.transform = `scale(${scale})`;
            }
            
            noBtn.innerText = phrases[phraseIndex];
            phraseIndex = (phraseIndex + 1) % phrases.length;
            
            // Subtle movement to keep it interactive
            const x = Math.random() * 30 - 15;
            const y = Math.random() * 30 - 15;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        });

        yesBtn.addEventListener('click', () => {
            questionBox.classList.add('hidden');
            successBox.classList.remove('hidden');
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }, 200);
        });
    </script>
</body>
</html>
