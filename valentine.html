<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff0f3;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }

        #container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.2);
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        .gif-container img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 100px; /* Space for the growing button */
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s ease-in-out;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #808080;
            color: white;
        }

        .hidden { display: none; }

        /* Falling Hearts */
        .heart {
            position: fixed;
            top: -10vh;
            font-size: 2rem;
            animation: fall 3s linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="question-box">
            <div class="gif-container">
                <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGtxN2ZicWlzYmI1ZzF4M3Z6ZzV6Z3Z5eXp6Z3Z5eXp6Z3Z5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Asking">
            </div>
          <h1> Dear Julianna, </h1>
            <h1>Will you be my Valentine? 💖</h1>
            <div class="btn-group">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="success-box" class="hidden">
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGtxN2ZicWlzYmI1ZzF4M3Z6ZzV6Z3Z5eXp6Z3Z5eXp6Z3Z5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26FLdmIp6wJr91JAI/giphy.gif" alt="Happy">
            </div>
            <h1 style="color: #ff4d6d;">Yay! See you on the 14th! 🥰</h1>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionBox = document.getElementById('question-box');
        const successBox = document.getElementById('success-box');

        let scale = 1;
        const phrases = [
            "No", "Are you sure?", "Really sure??", "Think again!", 
            "Baby please", "Don't do this to me", "I'm gonna cry...", 
            "You're breaking my heart ;("
        ];
        let phraseIndex = 0;

        noBtn.addEventListener('click', () => {
            // Grow the Yes button
            scale += 0.5;
            yesBtn.style.transform = `scale(${scale})`;
            
            // Move No button slightly
            const x = Math.random() * 40 - 20;
            const y = Math.random() * 40 - 20;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;

            // Change No text
            noBtn.innerText = phrases[phraseIndex];
            phraseIndex = (phraseIndex + 1) % phrases.length;
        });

        yesBtn.addEventListener('click', () => {
            questionBox.classList.add('hidden');
            successBox.classList.remove('hidden');
            
            // Heart shower
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }, 150);
        });
    </script>
</body>
</html>
